name: native_kit_flutter
description: NativeKit Flutter facade — modular dual-end native APIs (permission first).
version: 0.0.1
homepage: https://github.com/TonyChan-hub/kippy

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bear1210.native_kit_flutter
        pluginClass: NativeKitFlutterPlugin
      ios:
        pluginClass: NativeKitFlutterPlugin
