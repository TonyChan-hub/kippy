<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zippy</title>
  </head>
  <body>
    <div class="app" id="app-root" data-mode="inspector">
      <header class="mode-bar">
        <div class="brand mode-brand">
          <img class="brand-mark" src="/brand-mark.png" alt="" width="36" height="36" />
          <div>
            <div class="brand-name">Zippy</div>
            <div class="brand-sub">devtools</div>
          </div>
        </div>
        <div class="mode-tabs" role="tablist" aria-label="Zippy modes">
          <button class="mode-tab" type="button" data-mode="git" role="tab" aria-selected="false">
            Git
          </button>
          <button
            class="mode-tab is-active"
            type="button"
            data-mode="inspector"
            role="tab"
            aria-selected="true"
          >
            Inspector
          </button>
          <button class="mode-tab" type="button" data-mode="tools" role="tab" aria-selected="false">
            Tools
          </button>
          <button class="mode-tab" type="button" data-mode="apk" role="tab" aria-selected="false">
            APK
          </button>
        </div>
        <div class="mode-bar-right">
          <div class="header-links" aria-label="External links">
            <button
              class="header-link"
              type="button"
              id="header-link-docs"
              title="Open Zippy docs"
            >
              Docs
            </button>
            <button
              class="header-link"
              type="button"
              id="header-link-github"
              title="Open Kippy on GitHub"
            >
              GitHub
            </button>
          </div>
          <div class="status" id="connection-status-wrap">
            <span class="status-dot" id="status-dot"></span>
            <span id="connection-status">Waiting for device</span>
          </div>
          <div id="runtime-meta" class="meta">—</div>
        </div>
      </header>

      <div
        class="update-banner"
        id="update-banner"
        hidden
        role="status"
        aria-live="polite"
      >
        <span class="update-banner-text" id="update-banner-text"></span>
        <div class="update-banner-actions">
          <button class="btn" type="button" id="update-banner-check">Check</button>
          <button class="btn" type="button" id="update-banner-download" hidden>Download</button>
          <button class="btn primary" type="button" id="update-banner-install" hidden>
            Restart &amp; install
          </button>
          <button class="btn ghost" type="button" id="update-banner-dismiss" hidden aria-label="Dismiss">
            Dismiss
          </button>
        </div>
      </div>

      <div class="mode-body" id="mode-inspector">
        <aside class="sidebar">
          <nav class="nav">
            <button class="nav-item is-active" type="button" data-panel="device">Device</button>
            <button class="nav-item" type="button" data-panel="kv">MMKV / KV</button>
            <button class="nav-item" type="button" data-panel="db">SQLite</button>
            <button class="nav-item" type="button" data-panel="network">Network</button>
            <button class="nav-item" type="button" data-panel="perf">Perf</button>
          </nav>
        </aside>

        <main class="main">
          <header class="topbar">
            <div>
              <h1 id="panel-title">Device</h1>
              <p id="panel-desc" class="muted">
                Connect a debug app to inspect runtime data.
              </p>
            </div>
          </header>

          <section class="panel" id="panel"></section>
        </main>
      </div>

      <div class="mode-body git-mode" id="mode-git" hidden>
        <div class="git-shell" id="git-shell"></div>
      </div>

      <div class="mode-body tools-mode" id="mode-tools" hidden>
        <div class="tools-shell-host" id="tools-shell"></div>
      </div>

      <div class="mode-body apk-mode" id="mode-apk" hidden>
        <div class="apk-shell-host" id="apk-shell"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
