description = "Check GitHub Releases for an application update (no download)"
commands.allow = ["updater_check"]

[[permission]]
identifier = "allow-updater-download"
description = "Download and stage an application update"
commands.allow = ["updater_download"]

[[permission]]
identifier = "allow-updater-install"
description = "Restart to install a downloaded update"
commands.allow = ["updater_install"]

[[permission]]
