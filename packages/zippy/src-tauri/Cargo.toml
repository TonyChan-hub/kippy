[package]
name = "zippy"
version = "0.0.2"
description = "Zippy — desktop inspector for mobile app debug data"
authors = ["Bear1210"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zippy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
url = "2"
dirs = "6"
base64 = "0.22"
apk-info = "1"
zip = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
