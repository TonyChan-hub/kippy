name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  # Redeploy when a Zippy release finishes so the DMG mirror stays current.
  workflow_run:
    workflows:
      - Release Zippy (macOS)
    types:
      - completed
  # Manual redeploy (Actions → Deploy docs → Run workflow)
  workflow_dispatch:

# Official GitHub Actions Pages deploy (more reliable than pushing gh-pages).
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions
# Site: https://tonychan-hub.github.io/kippy/
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip failed Zippy releases; still run on push / manual dispatch.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Mirror Zippy .dmg onto Pages — github.io is often reachable when
      # github.com/releases/download (objects CDN) is blocked.
      - name: Mirror Zippy DMG into docs/public/downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node docs/scripts/mirror-zippy-downloads.mjs

      - name: Build docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
