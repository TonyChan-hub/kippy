name: Release Zippy (macOS)

on:
  push:
    branches:
      - main
    paths:
      - 'packages/zippy/package.json'
      - 'packages/zippy/**'
      - 'packages/zippy-probe-protocol/**'
      - '.github/workflows/zippy-release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read package version
        id: version
        working-directory: packages/zippy
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=zippy-v$VERSION" >> "$GITHUB_OUTPUT"

      # Prefer GitHub Releases API over local tags (checkout does not fetch tags by default).
      - name: Skip if release already exists with assets
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reupload=false" >> "$GITHUB_OUTPUT"
            echo "No existing release for $TAG."
            exit 0
          fi
          ASSET_COUNT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets | length')
          if [ "$ASSET_COUNT" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reupload=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already has $ASSET_COUNT asset(s); skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reupload=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG exists but has no assets; will rebuild and upload."
          fi

      # Write the secret to a file — multiline / base64 keys are more reliable as a path
      # than an env string. Empty password secret must stay empty (key generated with -p "").
      - name: Prepare updater signing key
        id: signing
        if: steps.tag_check.outputs.skip != 'true'
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "No TAURI_SIGNING_PRIVATE_KEY repo secret — will ship DMG without updater signatures."
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/tauri-updater.key"
          printf '%s' "$RAW_KEY" > "$KEY_PATH"
          printf '\n' >> "$KEY_PATH"
          if grep -q "untrusted comment" "$KEY_PATH" \
            || printf '%s' "$RAW_KEY" | base64 -d 2>/dev/null | grep -q "untrusted comment"; then
            echo "Key looks like a Tauri/minisign private key."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY does not look like a minisign secret (missing 'untrusted comment'). Build may fail signing; we will fall back to DMG-only."
          fi
          echo "has_key=true" >> "$GITHUB_OUTPUT"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Sync tauri.conf.json version from package.json
        if: steps.tag_check.outputs.skip != 'true'
        working-directory: packages/zippy
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (conf.version !== process.env.VERSION) {
              conf.version = process.env.VERSION;
              fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
              console.log('Synced tauri.conf.json version ->', process.env.VERSION);
            } else {
              console.log('tauri.conf.json already at', process.env.VERSION);
            }
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build macOS app
        id: build
        if: steps.tag_check.outputs.skip != 'true'
        working-directory: packages/zippy
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.key_path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HAS_KEY: ${{ steps.signing.outputs.has_key }}
        run: |
          set -euo pipefail
          build_unsigned() {
            echo "Building without updater artifacts (DMG/app only)..."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
            echo "updater_signed=false" >> "$GITHUB_OUTPUT"
          }

          if [ "${HAS_KEY}" != "true" ]; then
            build_unsigned
            exit 0
          fi

          set +e
          npm run build
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "updater_signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)
          if [ -n "$DMG" ]; then
            echo "::warning::Updater signing failed after bundles were produced. Publishing DMG without updater signatures."
            echo "Fix TAURI_SIGNING_PRIVATE_KEY (full private key from \`tauri signer generate\`) and optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            rm -f src-tauri/target/release/bundle/macos/*.app.tar.gz.sig || true
            echo "updater_signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::Signed build failed with no DMG; retrying without updater artifacts..."
          build_unsigned

      # Apple Silicon rejects incomplete linker-signed bundles as "damaged" when quarantined.
      # Force a full ad-hoc .app seal even if tauri.conf signingIdentity was skipped.
      - name: Ensure macOS ad-hoc codesign
        if: steps.tag_check.outputs.skip != 'true'
        working-directory: packages/zippy
        run: |
          set -euo pipefail
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -1 || true)
          if [ -z "$APP" ]; then
            echo "No .app bundle found; skipping codesign repair."
            exit 0
          fi
          if codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "App already has a valid signature: $APP"
          else
            echo "Re-signing with ad-hoc identity: $APP"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
          fi
          # Rebuild DMG from the sealed .app so the installer carries the fixed signature.
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          VERSION=$(node -p "require('./package.json').version")
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64) ARCH_LABEL=aarch64 ;;
            x86_64) ARCH_LABEL=x86_64 ;;
            *) ARCH_LABEL="$ARCH" ;;
          esac
          DMG_PATH="$DMG_DIR/Zippy_${VERSION}_${ARCH_LABEL}.dmg"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          rm -f "$DMG_PATH"
          hdiutil create -volname "Zippy" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGE"
          echo "Rebuilt DMG: $DMG_PATH"
          codesign -dvvv "$APP" 2>&1 | head -20 || true

      - name: Write updater latest.json + docs download.json
        if: steps.tag_check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          UPDATER_SIGNED: ${{ steps.build.outputs.updater_signed }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="packages/zippy/src-tauri/target/release/bundle"
          UPDATER_DIR="$BUNDLE_ROOT"
          if [ -d "$BUNDLE_ROOT/macos" ]; then
            UPDATER_DIR="$BUNDLE_ROOT/macos"
          fi

          # Avoid duplicate asset basenames under dmg/ from previous copies.
          rm -f "$BUNDLE_ROOT/dmg/download.json" "$BUNDLE_ROOT/dmg/latest.json" 2>/dev/null || true

          if [ "${UPDATER_SIGNED:-}" = "true" ]; then
            node packages/zippy/scripts/write-latest-json.mjs \
              "$VERSION" \
              "$UPDATER_DIR" \
              "$TAG" \
              "${{ github.repository }}"
            cp "$UPDATER_DIR/latest.json" "$BUNDLE_ROOT/latest.json"
          else
            echo "Skipping latest.json (no updater signatures)."
            rm -f "$BUNDLE_ROOT/latest.json"
          fi

          node packages/zippy/scripts/write-download-json.mjs \
            "$VERSION" \
            "$BUNDLE_ROOT" \
            "$TAG" \
            "${{ github.repository }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          UPDATER_SIGNED: ${{ steps.build.outputs.updater_signed }}
          REUPLOAD: ${{ steps.tag_check.outputs.reupload }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="packages/zippy/src-tauri/target/release/bundle"
          ASSETS=()
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            base=$(basename "$file")
            dup=false
            for existing in "${ASSETS[@]+"${ASSETS[@]}"}"; do
              if [ "$(basename "$existing")" = "$base" ]; then
                echo "Skipping duplicate asset name: $file (already have $existing)"
                dup=true
                break
              fi
            done
            if [ "$dup" = true ]; then
              continue
            fi
            ASSETS+=("$file")
          done < <(
            find "$BUNDLE_ROOT" -maxdepth 3 -type f \( \
              -name '*.dmg' -o \
              -name '*.app.tar.gz' -o \
              -name '*.app.tar.gz.sig' -o \
              -name 'latest.json' -o \
              -name 'download.json' \
            \) | LC_ALL=C sort
          )

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found"
            find "$BUNDLE_ROOT" -maxdepth 3 -type f || true
            exit 1
          fi

          echo "Uploading ${#ASSETS[@]} asset(s):"
          printf '  %s\n' "${ASSETS[@]}"

          NOTES=$(printf '%s\n' \
            "Automated macOS release for @bear1210/zippy v${VERSION} (Tauri)." \
            "" \
            "## Download" \
            "- Docs: https://tonychan-hub.github.io/kippy/guide/zippy#download" \
            "- Docs (中文): https://tonychan-hub.github.io/kippy/zh/guide/zippy#download")
          if [ "${UPDATER_SIGNED:-}" != "true" ]; then
            NOTES=$(printf '%s\n' "$NOTES" "" "Note: updater signatures were not published in this build (signing key missing or invalid). DMG install still works.")
          fi

          if [ "${REUPLOAD:-}" = "true" ]; then
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${ASSETS[@]}"
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Zippy v${VERSION}" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Zippy v${VERSION}" \
              --notes "$NOTES" \
              "${ASSETS[@]}"
          fi
